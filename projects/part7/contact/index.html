<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Closet - Contact</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="content">

  <header id="main-header">
    <img src="images/logo.png" alt="My Closet logo">
    <div id="brand"><h1>MY CLOSET</h1></div>

    <button id="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="main-nav">&#9776;</button>

    <nav id="main-nav">
      <ul>
        <li><a href="../home/index.html">Home</a></li>
        <li><a href="../closet/index.html">My Closet</a></li>
        <li><a href="../create-outfit/index.html">Create Outfit</a></li>
        <li><a href="../lookbook/index.html">Lookbook</a></li>
        <li><a href="../upload-item/index.html">Upload Item</a></li>
        <li><a href="../contact/index.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="center">
    <h2>Contact Us</h2>
    <p class="muted">Questions, feedback, or ideas? We would love to hear from you.</p>
  </section>

  <section class="columns" style="margin-top:20px;">
    <section class="two card">
      <form id="contact-form" method="post" novalidate>
        <input type="hidden" name="access_key" value="baf82b0b-0392-4490-8e23-04acae04b537">

        <div class="field">
          <label for="name">Name:</label>
          <input id="name" name="name" type="text" required>
        </div>

        <div class="field">
          <label for="email">Email:</label>
          <input id="email" name="email" type="email" required>
        </div>

        <!-- honeypot -->
        <input type="checkbox" name="botcheck" class="hidden" style="display:none;">

        <div class="field">
          <label for="topic">Topic:</label>
          <select id="topic" name="topic">
            <option value="general">General</option>
            <option value="bug">Bug Report</option>
            <option value="feature">Feature Request</option>
          </select>
        </div>

        <div class="field">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <button class="btn" type="submit">Send Message</button>
        <p id="contact-result" class="muted" aria-live="polite" style="margin-top:8px;"></p>
      </form>
  </section>

  <section class="one card">
  <h3>Our Location</h3>

  <div class="map-container">
    <iframe
      id="contact-map"
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3307.9521843058724!2d-81.03249888840897!3d33.9937619207038!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x88f8bb282cb2a61b%3A0x78bd73542178f54e!2sUniversity%20of%20South%20Carolina!5e0!3m2!1sen!2sus!4v1760456977720!5m2!1sen!2sus"
      title="Map to University of South Carolina"
      loading="lazy"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>
  <p class="muted" style="margin-top:8px;">
    <br>
    University of South Carolina<br>
    1244 Blossom Street<br>
    Columbia, SC 29208<br>
  </section>

</section>

  <footer id="main-footer">
    <p><strong>© Charlotte Baker</strong></p>
  </footer>
</div>

<script src="main.js" defer></script>
<script src="contact.js" defer></script>
</body>
</html>
