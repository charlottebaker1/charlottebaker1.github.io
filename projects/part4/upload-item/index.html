<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>My Closet - Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="main.js" defer></script>
<div id="content">
    
<header id="main-header">
  <img src="images/logo.png" alt="My Closet logo">
  <div id="brand"><h1>MY CLOSET</h1></div>

  <button id="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="main-nav">&#9776;</button>

  <nav id="main-nav">
    <ul>
      <li><a href="../home/index.html">Home</a></li>
      <li><a href="../closet/index.html">My Closet</a></li>
      <li><a href="../create-outfit/index.html">Create Outfit</a></li>
      <li><a href="../lookbook/index.html">Lookbook</a></li>
      <li><a href="../upload-item/index.html">Upload Item</a></li>
      <li><a href="../contact/index.html">Contact</a></li>
    </ul>
  </nav>
</header>


    <section class="center">
        <h2>ADD YOUR CLOTHES!</h2>
    </section>

    <section class="columns">
        <section class="three card">
            <img src="https://placehold.co/800x480?text=Drop+Item+Image+Here" alt="dropzone">
        </section>
        <aside class="two sidebar">
            <h3>Item Info</h3>
            <p class="muted">Title:</p>
            <div class="fake-input">Please enter</div>

            <hr>
            <p><strong>Type:</strong></p>
            <p><label><input type="checkbox"> Top</label></p>
            <p><label><input type="checkbox"> Pants</label></p>
            <p><label><input type="checkbox"> Sweater</label></p>
            <p><label><input type="checkbox"> Shorts</label></p>
            <p><label><input type="checkbox"> Shoes</label></p>
            <p><label><input type="checkbox"> Glasses</label></p>
            <p><label><input type="checkbox"> Jeans</label></p>
            <p><label><input type="checkbox"> Sweatshirt</label></p>

            <hr>
            <p><strong>Color:</strong></p>
            <p><label><input type="checkbox"> White</label></p>
            <p><label><input type="checkbox"> Black</label></p>
            <p><label><input type="checkbox"> Blue</label></p>
            <p><label><input type="checkbox"> Green</label></p>
            <p><label><input type="checkbox"> Red</label></p>
            <p><label><input type="checkbox"> Option6</label></p>

            <hr>
            <p><strong>Season:</strong></p>
            <p><label><input type="checkbox"> Summer</label></p>
            <p><label><input type="checkbox"> Spring</label></p>
            <p><label><input type="checkbox"> Fall</label></p>
            <p><label><input type="checkbox"> Winter</label></p>
        </aside>
    </section>

    <div class="center" style="margin:30px 0;">
        <a class="btn" href="../closet/index.html">Save Item To Closet</a>
    </div>

    
<footer id="main-footer">
    <p><strong>Copyright Charlotte Baker</strong></p>
</footer>

</div>
</body>
</html>
